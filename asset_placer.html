    <!--
        PERF — ce que cette page télécharge au démarrage, et pourquoi.

        ⚠ babylonjs.loaders.min.js a été RETIRÉ : il pèse ~1 Mo et ne sert
        qu'à importer des modèles GLTF/OBJ, que l'Asset Placer ne charge jamais
        (il ne lit que du .bloxdschem / .json). Un seul script de moins sur la
        route critique.

        `preconnect` : la poignée de main DNS + TLS + HTTP vers le CDN coûte
        100 à 300 ms sur une connexion mobile. Elle est lancée dès le <head>,
        pendant que le CSS se charge, au lieu d'être découverte en fin de
        document. `preload` fait partir le moteur 3D immédiatement.

        `defer` : le HTML (ici 40 Ko de panneau de contrôle) peut être parseur
        et peint pendant le téléchargement ; l'ordre d'exécution — moteur 3D
        avant le code applicatif — est garanti par `defer`.
    -->
    <link rel="preconnect" href="https://cdn.babylonjs.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://cdn.babylonjs.com">
    <link rel="preload" as="script" href="https://cdn.babylonjs.com/babylon.js">

    <!-- Styles -->
    <link rel="stylesheet" href="asset_placer.css">
</head>
<body>
    <!-- Babylon 3D background: fullscreen, behind the interface -->
    <div id="canvas-container" aria-label="Babylon 3D scene">
        <canvas id="renderCanvas"></canvas>
    </div>

    <!-- UI overlay -->
    <div id="ui-overlay" aria-label="Editor interface"></div>

    <!--
        JavaScript modules - Fusionnés en 2 fichiers (ordre de dépendance)
    -->

    <!-- Babylon.js (moteur 3D) — ~4 Mo, à charger avant le code de l'éditeur -->
    <script defer src="https://cdn.babylonjs.com/babylon.js"></script>
    <!-- JSZip (uniquement pour l'export .zip des mondes découpés) -->
    <script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

    <!-- 0. Palette unifiée des couleurs de blocs (utilisée par tous les outils) -->
    <script defer src="block_colors.js"></script>

    <!-- 1. Utilitaires, données, moteur 3D, interaction & terrain -->
    <script defer src="asset_placer-core.js"></script>

    <!-- 2. Interface & application -->
    <script defer src="asset_placer-ui.js"></script>
    <script defer src="welcome.js"></script>
</body>
</html>
