<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloxd Tools — Schem Splitter v6.7.3</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQBAMAAADt3eJSAAAAKlBMVEVHcEwAAAD///+mBwWPj4+6urr/AgDJBALgEhDdCQcAADVAQEAAANMwMDDLTWdNAAAAAXRSTlMAQObYZgAAAEVJREFUCNdjYMAGGAUgtKBkIYRvOK0dLMRomZYBFmKckZYGFhI2BgJDIEMkSElJ1RHECFwNZUSdxsmIvQthMAoCgQDCZgAI7xCncUnAaQAAAABJRU5ErkJggg==">
    <link rel="stylesheet" href="schem_splitter.css">
</head>
<body>
    <div id="topbar">
        <a class="home-corner-btn" href="index.html?view=home" target="_top" title="⌂ Menu principal" onclick="try{localStorage.setItem('bloxdTools.lastView','home'); if(window.top && window.top.localStorage) window.top.localStorage.setItem('bloxdTools.lastView','home'); if(window.top && window.top.BloxdToolsHub && window.top.BloxdToolsHub.goHome){event.preventDefault(); window.top.BloxdToolsHub.goHome();} else if(window.top){try{window.top.postMessage({type:'bloxdTools:goHome'},'*');}catch(e){}}}catch(e){}">🏠</a>
        <button class="tbtn primary" id="btn-import"><span>📂</span> Import .bloxdschem</button>
        <input id="file-input" type="file" accept=".bloxdschem,.schem,.bin" multiple style="display:none">
        <span class="tbtn-sep"></span>
        <button class="tbtn" id="btn-detect"><span>✂️</span> Detect & Split</button>
        <button class="tbtn success" id="btn-download"><span>📦</span> Download ZIP</button>
    </div>
    <canvas id="splitter-canvas"></canvas>
    <div id="start-guide">
        <div class="start-card">
            <h2 id="sg-title">Séparer un schem</h2>
            <ol>
                <li id="sg-1"></li>
                <li id="sg-2"></li>
                <li id="sg-3"></li>
            </ol>
            <p id="sg-note"></p>
            <button class="tbtn primary" id="sg-import" type="button"></button>
        </div>
    </div>
    <div id="info-panel"></div>
    <div id="drop-overlay"><div class="drop-msg">📥 Drop your .bloxdschem here</div></div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="schem_splitter.js"></script>
    <script src="welcome.js"></script>
</body>
</html>
